  - { name: delivery.checkin,              tier: authenticated, phase: "5",            profile: delivery }
  - { name: delivery.checkout,             tier: authenticated, phase: "5",            profile: delivery }
  - { name: delivery.record_evidence,      tier: authenticated, phase: "5",            profile: evidence }
