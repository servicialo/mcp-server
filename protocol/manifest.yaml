  - { name: registry.list_regions,         tier: public,        phase: "1",            profile: discovery }
  - { name: registry.list_event_types,     tier: public,        phase: "1",            profile: discovery }
  - { name: services.list,                 tier: public,        phase: "1",            profile: discovery }
