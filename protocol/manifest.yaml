# Specified in PROTOCOL.md §13.2 and spec/HTTP_PROFILE.md §10–§11 but NOT
# implemented in the reference MCP server. verify-manifest-tools.mjs fails if
# any of these appears in code (it must then be promoted to `tools`).
specified_unimplemented_tools:
  - { name: service_orders.list,       profile: ordering }
  - { name: service_orders.get,        profile: ordering }
  - { name: service_orders.create,     profile: ordering }
  - { name: service_orders.propose,    profile: ordering }
  - { name: service_orders.activate,   profile: ordering }
  - { name: service_orders.get_ledger, profile: ordering }
  - { name: mandates.list,             profile: ordering }
  - { name: mandates.get,              profile: ordering }
  - { name: mandates.suspend,          profile: ordering }

# ── State machines ───────────────────────────────────────────────────────────
state_machines:
  service_lifecycle:
    schema: schema/service.schema.json
    states: [requested, scheduled, confirmed, in_progress, completed, documented,
             invoiced, collected, verified, cancelled, disputed, reassigning,
             rescheduling, partial]
    happy_path: [requested, scheduled, confirmed, in_progress, completed,
                 documented, invoiced, collected, verified]
    required: [requested, scheduled, confirmed, in_progress, completed, documented]
    optional_financial: [invoiced, collected, verified]
    exception: [cancelled, disputed, reassigning, rescheduling, partial]
    reference_implementation_divergence:
      tool: lifecycle.transition
      file: packages/mcp-server/src/tools/authenticated/lifecycle.ts
      enum: [scheduled, confirmed, in_progress, delivered, documented, charged,
             verified, cancelled]
      note: >
        Uses `delivered`/`charged` instead of `completed`/`invoiced`+`collected`
        for compatibility with the Coordinalo upstream API. Known divergence —
        do not change without a coordinated migration.
  billing_status:
    schema: schema/service.schema.json
    states: [pending, charged, invoiced, paid, disputed]
  service_order:
    schema: schema/service-order.schema.json
    states: [draft, proposed, negotiating, active, paused, completed, cancelled]
  dimensions:
    extension: state-dimensions
    doc: public/spec/extensions/state-dimensions.md
    note: >
      The protocol does not impose a total order across fulfillment, evidence,
      acceptance and settlement. The state-dimensions extension (draft)
      formalizes the orthogonal projection.

# ── Proof of Service model (draft extension) ─────────────────────────────────
# Single source of truth for the three related-but-independent dimensions of
# a Proof of Service dossier. Consumed by lib/data.ts (site copy) and
# cross-checked by scripts/verify-doc-claims.mjs against the extension doc.
#
#   certainty  — what evidence and corroboration exist (L1–L4, cumulative).
#                L4 does NOT mean "more true": it means additional financial
#                evidence exists. A free delivery can reach sufficient
#                certainty without L4; a reconciled payment does not by
#                itself prove quality or delivered scope.
#   dossier    — whether the evidence satisfies an applicable accreditation
#                policy. A dossier can be accredited at L1, L2, L3 or L4,
#                depending on the policy (accreditation_policy → evidence
#                requirements, required attestations, minimum certainty
#                level, exceptions).
#   settlement — the financial position. Mirrors the `financial` dimension
#                of the state-dimensions extension (kept bit-exact).
proof_of_service:
  doc: public/spec/extensions/proof-of-service.md
  certainty_levels:
    - { id: L1, key: asserted,                name: Asserted }
    - { id: L2, key: bilateral,               name: Bilateral attestation }
    - { id: L3, key: operationally_supported, name: Operationally supported }
    - { id: L4, key: financially_reconciled,  name: Financially reconciled }
  dossier_states: [draft, supported, accredited, disputed, revoked]
  settlement_states: [not_required, pending, invoiced, partially_paid, paid,
                      refunded, charged_back, written_off]

# ── Extensions registry ──────────────────────────────────────────────────────
# maturity: draft | experimental | candidate | stable | deprecated
extensions:
  - { id: evidence-profiles,    name: Evidence Profiles,    maturity: candidate,
      doc: schema/evidence/base.schema.json }
  - { id: settlement,           name: Settlement,           maturity: experimental,
      doc: PROTOCOL.md#128-payment-model }
  - { id: disputes,             name: Disputes,             maturity: draft,
      doc: null }
  - { id: delegated-agency,     name: Delegated Agency,     maturity: experimental,
      doc: spec/delegated-agency-model.md,
      note: "Mandate scopes are advisory in the reference implementation — not enforced at the MCP tool boundary." }
  - { id: network-intelligence, name: Network Intelligence, maturity: experimental,
      doc: PROTOCOL.md#14-network-intelligence }
  - { id: state-dimensions,     name: State Dimensions,     maturity: draft,
      doc: public/spec/extensions/state-dimensions.md }
  - { id: proof-of-service,     name: Proof of Service,     maturity: draft,
      doc: public/spec/extensions/proof-of-service.md }
  - { id: webhooks,             name: Webhooks,             maturity: experimental,
      doc: WEBHOOKS.md }

# ── Implementations ──────────────────────────────────────────────────────────
implementations:
