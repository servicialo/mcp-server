# ============================================================================
# protocol/manifest.yaml — Single source of truth for the Servicialo protocol
# surface.
#
# Consumed by:
#   - lib/manifest.ts            (site: versions, tool lists, extensions)
#   - scripts/verify-manifest-tools.mjs   (CI: manifest ↔ code parity)
#   - scripts/verify-versions.mjs         (CI: version unification)
#   - scripts/verify-doc-claims.mjs       (CI: doc claims vs derived counts)
#
# Rules:
#   - Counts are NEVER stored here. They are derived from the `tools` list.
#   - Wire values (resolver X-Servicialo-Version, FINGERPRINT_SALT) are
#     documented here but MUST NOT be changed to match the protocol version.
# ============================================================================
manifest_version: 1

protocol:
  name: Servicialo
  version: "0.10"          # verify-versions.mjs compares against PROTOCOL.md / SPEC.md / CHANGELOG.md
  status: draft            # draft | stable
  spec: PROTOCOL.md
  quick_ref: SPEC.md
  canonical_url: https://servicialo.com/spec
  spec_host: https://spec.servicialo.com
  repository: https://github.com/servicialo/mcp-server
  license: Apache-2.0

# ── Canonical objects ────────────────────────────────────────────────────────
# schema: path to a JSON Schema, or `narrative` when the concept is specified
# in prose only (no wire object yet).
objects:
  - id: service_offer
    name: Service Offer
    schema: narrative
    defined_in: PROTOCOL.md#5-the-8-dimensions
    surfaced_by: [services.list]
    note: Published catalog entry — what an organization offers.
  - id: service
    name: Service (wire object)
    schema: schema/service.schema.json
    represents: service_delivery
    note: >
      In the current wire format, `Service` represents one Service Delivery
      instance (the executed atomic instance, modeled across 8 dimensions).
      The name is retained for wire compatibility — renaming would break
      schemas, tools and consumers. "Service"/"servicio" as bare prose is the
      general domain term, not a fourth conceptual object.
  - id: service_order
    name: Service Order
    schema: schema/service-order.schema.json
    note: The agreement between parties — scope, parties, price, policies, validity.
  - id: service_delivery
    name: Service Delivery
    schema: narrative
    defined_in: PROTOCOL.md#6-lifecycle
    wire_object: service
    note: >
      The executed atomic instance — the conceptual name of the delivery unit.
      Its wire representation today is the `Service` object
      (schema/service.schema.json); the wire name is kept for compatibility.
  - id: evidence_event
    name: Evidence Event
    schema: schema/evidence/base.schema.json
    vertical_schemas:
      - schema/evidence/health.schema.json
      - schema/evidence/home.schema.json
      - schema/evidence/legal.schema.json
      - schema/evidence/education.schema.json
      - schema/evidence/consulting.schema.json
  - id: settlement_event
    name: Settlement Event
    schema: narrative
    defined_in: PROTOCOL.md#128-payment-model
    note: Today expressed as billing.* dimension + payments.* tools.
  - id: service_mandate
    name: ServiceMandate
    schema: schema/service-mandate.schema.json
  - id: proof_of_service
    name: Proof of Service
    schema: narrative
    status: draft
    defined_in: public/spec/extensions/proof-of-service.md
    note: Verifiable dossier linking agreement, delivery, evidence and settlement. No wire object yet.

# ── Capability profiles ──────────────────────────────────────────────────────
# status: stable | candidate | experimental
profiles:
  - { id: discovery,    name: Discovery,    status: stable }
  - { id: ordering,     name: Ordering,     status: experimental }   # service_orders.* specified, not implemented
  - { id: coordination, name: Coordination, status: stable }
  - { id: delivery,     name: Delivery,     status: stable }
  - { id: evidence,     name: Evidence,     status: candidate }
  - { id: settlement,   name: Settlement,   status: experimental }
  - { id: network,      name: Network,      status: experimental }

# ── Bindings (the protocol is transport-independent) ─────────────────────────
# Conformance requires AT LEAST ONE machine-to-machine binding implementing
# the required Core profiles. No specific binding is mandatory: a pure-HTTP
# implementation is conformant without MCP. MCP is the RECOMMENDED binding
# for agentic integrations, not a conformance condition.
# maturity: stable | candidate | experimental
bindings:
  http:
    maturity: stable             # normative machine-to-machine binding
    profile: spec/HTTP_PROFILE.md
    profile_version: "1.0.0"     # version of the HTTP binding document, not the protocol
    resolver_api_version: "1.0"  # wire value of X-Servicialo-Version (lib/servicialo/response.ts) — DO NOT change
    openapi: spec/openapi.yaml
  mcp:
    maturity: stable             # reference binding, in production (Coordinalo)
    package: "@servicialo/mcp-server"
    package_version: "0.9.12"    # verify-versions.mjs compares with package.json + server.json
    transports: [stdio, streamable-http]
    remote: https://servicialo.com/api/mcp
  a2a:
    maturity: experimental       # partial surface: discovery + booking intents, not the full tool surface
    version: "0.3"
    agent_card: /.well-known/agent.json
    endpoint: "POST /{orgSlug}/a2a"

