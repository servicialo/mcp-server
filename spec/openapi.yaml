    MandateData:
      description: Mandate per schema/service-mandate.schema.json
      $ref: ../schema/service-mandate.schema.json
    MandateResource:
      $ref: '#/components/schemas/MandateData'
    SuspendRequest:
      type: object
      properties:
        reason:
          type: string
    ResourceCollection:
      type: array
      items:
        $ref: '#/components/schemas/ResourceData'
    ResourceData:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        type:
