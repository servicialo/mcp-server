# Generated from the contract table in docs/analysis/contract-audit-2026-08-24.md
# and kept in step with spec/HTTP_PROFILE.md 1.1.0.
# scripts/verify-conformance-parity.mjs fails CI if the two disagree.
openapi: 3.1.0
info:
  title: Servicialo HTTP API
  description: 'Canonical HTTP binding for the Servicialo protocol v0.10.

    Describes the contract the reference tool handlers actually send through

    HttpAdapter (packages/mcp-server/src/adapter-http.ts) — plain JSON, no

    JSON:API envelope. See spec/HTTP_PROFILE.md 1.1.0 for the normative text

    and its erratum for what changed from 1.0.0.

    '
  version: 1.1.0
  x-servicialo-protocol-version: '0.10'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Servicialo
    url: https://servicialo.com
servers:
- url: https://{host}/v1
  description: Example server. Paths resolve against {base}/v1 — the literal segment /servicialo is NOT
    required.
  variables:
    host:
      default: api.your-implementation.com
      description: Your implementation host, optionally with a path prefix.
tags:
- name: Discovery
  description: Phase 1 — Public endpoints. No authentication required.
- name: Understanding
  description: Phase 2 — Service and contract details.
- name: Commitment
  description: Phase 3 — Client resolution, booking, and confirmation.
- name: Lifecycle
  description: Phase 4 — State transitions, rescheduling, cancellation.
- name: Delivery
  description: Phase 5 — Check-in, check-out, evidence.
- name: Closing
  description: Phase 6 — Documentation, sales, payments.
- name: Service Orders
  description: Bilateral commercial agreements.
- name: Mandates
  description: AI agent delegation management.
- name: Resources
  description: Physical resource management (rooms, boxes, equipment).
- name: A2A Extension
  description: 'Agent-to-Agent (A2A) interoperability endpoints.

    Optional for basic Servicialo implementations.

    Required for "Servicialo A2A Ready" certification.

    See: https://a2a-protocol.org/

    '
security:
- BearerAuth: []
- ApiKeyAuth: []
paths:
  /:
    get:
      operationId: getCapabilities
      summary: Server capabilities
      description: Returns protocol version and supported tools.
      tags:
      - Discovery
      security: []
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Server capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
              example:
                protocol_version: '0.10'
                profile_version: 1.1.0
                compliance: extended
                capabilities:
                - registry.search
                - service.get
                - scheduling.book
                - lifecycle.transition
                - delivery.record_evidence
                - payments.create_sale
        '406':
          description: Unsupported protocol version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                - status: '406'
                  code: UNSUPPORTED_VERSION
                  title: Unsupported protocol version
                  detail: X-Servicialo-Version '0.5' is not supported.
  /manifest:
    get:
      operationId: registryManifest
      x-mcp-tool: registry.manifest
      summary: Node manifest
      description: 'Returns the node manifest: the protocol version it speaks and the endpoints it exposes.
        REQUIRED by conformance.core.required_operations.


        Field shape note: the reference compatibility suite and scripts/verify-interop.mjs both read `protocol_version`;
        no reference tool consumes any field of this response (registry.manifest returns the body verbatim).
        The resolver publishes its own, different manifest object at /api/servicialo/manifest using `servicialo_version`
        — that is the resolver describing itself, not a node manifest.'
      tags:
      - Discovery
      security: []
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Node manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeManifest'
              example:
                protocol_version: '0.10'
                name: Coordinalo
                org_slug: clinica-dental-sur
                endpoints:
                  services: /v1/organizations/{org_slug}/services
                  availability: /v1/organizations/{org_slug}/availability
                  sessions: /v1/sessions
  /registry:
    get:
      operationId: registrySearch
      x-mcp-tool: registry.search
      summary: Search organizations by vertical and location
      tags:
      - Discovery
      security: []
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: vertical
        in: query
        required: true
        schema:
          type: string
        example: kinesiologia
      - name: location
        in: query
        schema:
          type: string
        example: Santiago
      - name: country
        in: query
        schema:
          type: string
          default: cl
        example: cl
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 100
        example: 10
      responses:
        '200':
          description: Matching organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCollection'
              example:
              - id: clinica-dental-sur
                name: Clínica Dental Sur
                vertical: dental
                location: Santiago
                country: cl
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{org_slug}/services:
    get:
      operationId: servicesList
      x-mcp-tool: services.list
      summary: List public service catalog
      tags:
      - Discovery
      security: []
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: org_slug
        in: path
        required: true
        schema:
          type: string
        example: clinica-dental-sur
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: cl
        description: ISO 3166-1 alpha-2. Sent by registry.get_organization.
      responses:
        '200':
          description: Collection of public services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCollection'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Both services.list and registry.get_organization resolve to this endpoint in the reference
        client; registry.get_organization additionally sends a `country` query parameter.
      x-mcp-tool-also: registry.get_organization
  /organizations/{org_slug}/availability:
    get:
      operationId: schedulingCheckAvailability
      x-mcp-tool: scheduling.check_availability
      summary: Check available time slots (public)
      tags:
      - Discovery
      security: []
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/OrgSlug'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-03-16'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-03-22'
      - name: serviceId
        in: query
        schema:
          type: string
      - name: providerId
        in: query
        schema:
          type: string
      - name: resourceId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Available time slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCollection'
              example:
                slots:
                - providerId: prov_abc
                  start: '2026-03-16T12:00:00Z'
                  end: '2026-03-16T12:45:00Z'
                  resourceId: res_box3
                timezone: America/Santiago
        '422':
          $ref: '#/components/responses/ValidationError'
  /services/{service_id}:
    get:
      operationId: serviceGet
      x-mcp-tool: service.get
      summary: Get full 8-dimension service definition
      tags:
      - Understanding
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: service_id
        in: path
        required: true
        schema:
          type: string
        example: svc_kinesiologia_45
      responses:
        '200':
          description: Service object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResource'
              example:
                id: svc_kinesiologia_45
                type: physical_therapy_session
                vertical: health
                name: Sesión de rehabilitación — 45 min
                duration_minutes: 45
                provider:
                  id: prov_abc
                  organization_id: org_xyz
                client:
                  id: cli_001
                schedule:
                  requested_at: '2026-03-15T08:00:00Z'
                location:
                  type: in_person
                  room: Box 3
                lifecycle:
                  current_state: requested
                proof: {}
                billing:
                  amount:
                    value: 35000
                    currency: CLP
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /services/{service_id}/contract:
    get:
      operationId: contractGet
      x-mcp-tool: contract.get
      summary: Get service contract (policies, evidence requirements)
      tags:
      - Understanding
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: service_id
        in: path
        required: true
        schema:
          type: string
      - name: org_id
        in: query
        required: true
        schema:
          type: string
        example: org_xyz
      responses:
        '200':
          description: Contract with cancellation, no-show, arbitration policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResource'
        '404':
          $ref: '#/components/responses/NotFound'
  /clients:
    post:
      operationId: clientsGetOrCreate
      x-mcp-tool: clients.get_or_create
      summary: Find or create a client (upsert)
      tags:
      - Commitment
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpsertRequest'
            example:
              email: maria@example.com
              phone: '+56912345678'
              name: María
              lastName: González
              actor:
                type: agent
                id: agent_01
                mandate_id: mdt_abc
      responses:
        '200':
          description: Existing client found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResource'
        '201':
          description: New client created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResource'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions:
    post:
      operationId: schedulingBook
      x-mcp-tool: scheduling.book
      summary: Book a new session
      tags:
      - Commitment
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBookRequest'
            example:
              serviceId: svc_001
              providerId: prov_abc
              clientId: cli_001
              startTime: '2026-03-16T09:00:00-03:00'
              resourceId: res_box3
              actor:
                type: agent
                id: agent_01
                mandate_id: mdt_abc
      responses:
        '201':
          description: Session created in `requested` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
              example:
                id: ses_abc123
                service_id: svc_001
                provider_id: prov_abc
                client_id: cli_001
                starts_at: '2026-03-16T09:00:00-03:00'
                resource_id: res_box3
                lifecycle:
                  current_state: requested
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{session_id}/confirm:
    post:
      operationId: schedulingConfirm
      x-mcp-tool: scheduling.confirm
      summary: Confirm a booked session
      tags:
      - Commitment
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorRequest'
            example:
              actor:
                type: client
                id: cli_001
      responses:
        '200':
          description: Session confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sessions/{session_id}/lifecycle:
    get:
      operationId: lifecycleGetState
      x-mcp-tool: lifecycle.get_state
      summary: Get lifecycle state and transition history
      tags:
      - Lifecycle
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Lifecycle state with available transitions and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResource'
              example:
                id: ses_abc123
                current_state: confirmed
                available_transitions:
                - in_progress
                - cancelled
                transitions:
                - from: null
                  to: requested
                  at: '2026-03-15T08:00:00Z'
                  by: agent_01
                  method: agent
                - from: requested
                  to: confirmed
                  at: '2026-03-15T08:05:00Z'
                  by: cli_001
                  method: manual
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}:
    put:
      operationId: schedulingReschedule
      x-mcp-tool: scheduling.reschedule
      summary: Reschedule a session (update start time)
      tags:
      - Lifecycle
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
            example:
              startTime: '2026-03-17T10:00:00-03:00'
              actor:
                type: client
                id: cli_001
      responses:
        '200':
          description: Session rescheduled (state returns to `scheduled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidTransition'
      description: The reference tool sends PUT to the session resource with the new startTime. 1.0.0
        specified POST /sessions/{session_id}/reschedule, which no reference client calls.
  /sessions/{session_id}/lifecycle/transition:
    post:
      operationId: lifecycleTransition
      x-mcp-tool: lifecycle.transition
      summary: Execute a state transition
      tags:
      - Lifecycle
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            example:
              toState: in_progress
              actor:
                type: provider
                id: prov_abc
      responses:
        '200':
          description: Session transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
              example:
                id: ses_abc123
                lifecycle:
                  current_state: in_progress
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sessions/{session_id}/cancel:
    post:
      operationId: schedulingCancel
      x-mcp-tool: scheduling.cancel
      summary: Cancel a session
      tags:
      - Lifecycle
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            example:
              reason: Client requested cancellation.
              actor:
                type: client
                id: cli_001
      responses:
        '200':
          description: Session cancelled with policy applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sessions/{session_id}/checkin:
    post:
      operationId: deliveryCheckin
      x-mcp-tool: delivery.checkin
      summary: Record check-in
      tags:
      - Delivery
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
            example:
              actor:
                type: provider
                id: prov_abc
              location:
                lat: -33.4489
                lng: -70.6693
              timestamp: '2026-03-16T09:02:00-03:00'
      responses:
        '200':
          description: Check-in recorded, session in `in_progress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sessions/{session_id}/checkout:
    post:
      operationId: deliveryCheckout
      x-mcp-tool: delivery.checkout
      summary: Record check-out
      tags:
      - Delivery
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              actor:
                type: provider
                id: prov_abc
              location:
                lat: -33.4489
                lng: -70.6693
              timestamp: '2026-03-16T09:47:00-03:00'
      responses:
        '200':
          description: Check-out recorded, session in `completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sessions/{session_id}/evidence:
    post:
      operationId: deliveryRecordEvidence
      x-mcp-tool: delivery.record_evidence
      summary: Record proof-of-delivery evidence
      tags:
      - Delivery
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
            example:
              evidenceType: gps
              data:
                lat: -33.4489
                lng: -70.6693
                accuracy_meters: 5
              actor:
                type: provider
                id: prov_abc
      responses:
        '201':
          description: Evidence recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sessions/{session_id}/documentation:
    post:
      operationId: documentationCreate
      x-mcp-tool: documentation.create
      summary: Create service documentation
      tags:
      - Closing
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentationRequest'
            example:
              content: Paciente presenta mejoría en rango de movimiento...
              templateId: tmpl_clinical_note
              actor:
                type: provider
                id: prov_abc
      responses:
        '201':
          description: Documentation created, session in `documented`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
  /sales:
    post:
      operationId: paymentsCreateSale
      x-mcp-tool: payments.create_sale
      summary: Create a sale (charge)
      tags:
      - Closing
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
            example:
              clientId: cli_001
              serviceId: svc_001
              providerId: prov_abc
              quantity: 1
              unitPrice: 35000
      responses:
        '201':
          description: Sale created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResource'
              example:
                id: sale_001
                client_id: cli_001
                service_id: svc_001
                provider_id: prov_abc
                quantity: 1
                unit_price: 35000
                total: 35000
                status: pending
        '422':
          $ref: '#/components/responses/ValidationError'
  /sales/{sale_id}:
    get:
      operationId: paymentsGetStatusBySale
      x-mcp-tool: payments.get_status
      summary: Get payment status for a sale
      tags:
      - Closing
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: sale_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Payment status or account history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments:
    post:
      operationId: paymentsRecordPayment
      x-mcp-tool: payments.record_payment
      summary: Record a payment against a sale
      tags:
      - Closing
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              ventaId: sale_001
              amount: 35000
              paymentMethod: transferencia
              reference: TRX-20260316-001
      responses:
        '201':
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Record a payment against a sale. The sale is identified by `ventaId` in the body, not
        by a path parameter. Spanish wire vocabulary — see HTTP_PROFILE.md 9.3.
  /clients/{client_id}/account-history:
    get:
      operationId: paymentsGetAccountHistory
      x-mcp-tool: payments.get_status
      summary: Get a client account history
      tags:
      - Closing
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Payment status or account history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /service-orders:
    get:
      operationId: serviceOrdersList
      x-mcp-tool: service_orders.list
      summary: List service orders
      tags:
      - Service Orders
      parameters:
      - $ref: '#/components/parameters/ServicialoVersion'
      - $ref: '#/components/parameters/Accept'
      - name: organization_id
