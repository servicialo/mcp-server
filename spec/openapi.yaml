      - name: date_to
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-03-22'
      - name: timezone
        in: query
        schema:
          type: string
        example: America/Santiago
      responses:
        '200':
          description: Available time slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCollection'
        '404':
