        unit_price:
          type: number
        total:
          type: number
        status:
          type: string
    PaymentRequest:
      type: object
      required:
      - amount
      - paymentMethod
      - ventaId
      properties:
        ventaId:
          type: string
          description: Identifier of the sale this payment settles.
        amount:
          type: number
        paymentMethod:
          type: string
          enum:
          - efectivo
          - transferencia
          - mercadopago
          - tarjeta
        reference:
          type: string
    PaymentResource:
      type: object
      properties:
        id:
          type: string
        sale_id:
          type: string
        amount:
          type: number
        method:
          type: string
        reference:
          type: string
        recorded_at:
          type: string
