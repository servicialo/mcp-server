                  $ref: '#/components/schemas/AgentCard'
  /organizations/{org_slug}/.well-known/agent.json:
    get:
      operationId: a2aGetAgentCard
      summary: A2A Agent Card for an organization
      description: 'Returns the A2A Agent Card describing this organization''s capabilities,

        skills, and supported interaction modes. Used by external agents for

        discovery before initiating A2A tasks.

        '
      tags:
      - A2A Extension
      security: []
      parameters:
      - name: org_slug
        in: path
        required: true
        schema:
          type: string
        description: Organization slug.
      responses:
        '200':
          description: Agent Card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_slug}/a2a:
    post:
      operationId: a2aTaskEndpoint
      summary: A2A JSON-RPC task endpoint
      description: 'JSON-RPC 2.0 endpoint for A2A task operations.

        Supports methods: `tasks/send`, `tasks/get`, `tasks/cancel`.

        The remote agent processes booking requests and returns task status.

        '
      tags:
      - A2A Extension
      parameters:
      - name: org_slug
        in: path
        required: true
        schema:
          type: string
        description: Organization slug.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AJsonRpcRequest'
            examples:
              tasksSend:
                summary: Send a booking task
                value:
                  jsonrpc: '2.0'
                  id: req-1
                  method: tasks/send
                  params:
                    id: task-abc-123
                    message:
                      role: user
                      parts:
                      - type: text
                        text: Book a kinesiology session for tomorrow at 10am
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AJsonRpcResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication.
  parameters:
    ServicialoVersion:
      name: X-Servicialo-Version
      in: header
      required: true
      schema:
        type: string
        enum:
        - '1.0'
      description: Version of the observable HTTP contract (HTTP_PROFILE.md 2.2.1). Independent of the
        protocol version and of the profile document version, both declared in protocol/manifest.yaml.
    Accept:
      name: Accept
      in: header
      required: false
      schema:
        type: string
        enum:
        - application/json
      description: RECOMMENDED. The reference client does not send it; servers MUST NOT require it.
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      example: ses_abc123
    OrgSlug:
      name: org_slug
      in: path
      required: true
      schema:
        type: string
      example: clinica-dental-sur
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - status: '404'
              code: NOT_FOUND
              title: Resource not found
              detail: The requested resource does not exist.
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - status: '422'
              code: VALIDATION_ERROR
              title: Validation failed
              detail: Missing required field.
              source:
                pointer: /data/attributes/service_id
    InvalidTransition:
      description: Invalid state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - status: '422'
              code: INVALID_TRANSITION
              title: Invalid state transition
              detail: 'Cannot transition from ''requested'' to ''in_progress''. Valid targets: [''scheduled''].'
              source:
                pointer: /data/attributes/to_state
    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - status: '409'
              code: CONFLICT
              title: Conflict
              detail: Time slot is no longer available.
    Forbidden:
      description: Insufficient permissions or mandate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - status: '403'
              code: SCOPE_INSUFFICIENT
              title: Insufficient scope
              detail: Mandate does not grant 'service:read'.
  schemas:
    Actor:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - client
          - provider
          - organization
          - agent
        id:
          type: string
        mandate_id:
          type: string
          description: REQUIRED when type is "agent".
        on_behalf_of:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
    GeoLocation:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    Transition:
      type: object
      required:
      - to
      - at
      - by
      properties:
        from:
          type:
          - string
          - 'null'
        to:
          type: string
        at:
          type: string
          format: date-time
        by:
          type: string
        method:
          type: string
          enum:
          - auto
          - manual
          - agent
        metadata:
          type: object
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - status
            - code
            - title
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
                  parameter:
                    type: string
    CapabilitiesResponse:
      type: object
      properties:
        protocol_version:
          type: string
        profile_version:
          type: string
        compliance:
          type: string
          enum:
          - minimum
          - extended
        capabilities:
          type: array
          items:
            type: string
    OrganizationCollection:
      type: array
      items:
        $ref: '#/components/schemas/OrganizationData'
    OrganizationData:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        vertical:
          type: string
        location:
          type: string
        country:
          type: string
    OrganizationResource:
      $ref: '#/components/schemas/OrganizationData'
    ServiceCollection:
      type: array
      items:
        $ref: '#/components/schemas/ServiceData'
    ServiceData:
      description: Service object per schema/service.schema.json
      $ref: ../schema/service.schema.json
    ServiceResource:
      $ref: '#/components/schemas/ServiceData'
    AvailabilityCollection:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
              resourceId:
                type: string
        timezone:
          type: string
      description: 'Availability as the reference implementation returns it: a flat `slots` list with
        ISO 8601 UTC datetimes, plus the timezone.'
    ContractResource:
      type: object
      description: Contract with policies and evidence requirements.
      properties:
        id:
          type: string
        cancellation_policy:
          type: object
        no_show_policy:
          type: object
        arbitration_policy:
          type: object
        required_evidence:
          type: array
          items:
            type: string
    ClientUpsertRequest:
      type: object
      required:
      - actor
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        name:
          type: string
        lastName:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
    ClientResource:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        name:
          type: string
        last_name:
          type: string
        history_summary:
          type: object
    SessionBookRequest:
      type: object
      required:
      - serviceId
      - providerId
      - clientId
      - startTime
      - actor
      properties:
        serviceId:
          type: string
        providerId:
          type: string
        clientId:
          type: string
        startTime:
          type: string
          format: date-time
        resourceId:
          type: string
        human_intent_confirmed:
          type: boolean
          default: false
          description: 'OPTIONAL. When true, the caller asserts that a human user

            has reviewed and confirmed this booking intent before

            submission. When omitted or false, no such assertion is

            made. Caller-neutral vocabulary: the protocol records

            what the caller asserts; treatment of either case is

            implementer policy. See HTTP_PROFILE.md §6.2.1.

            '
        actor:
          $ref: '#/components/schemas/Actor'
    SessionResource:
      type: object
      properties:
        id:
          type: string
        service_id:
          type: string
        provider_id:
          type: string
        client_id:
          type: string
        starts_at:
          type: string
          format: date-time
        resource_id:
          type: string
        lifecycle:
          type: object
          properties:
            current_state:
              type: string
            transitions:
              type: array
              items:
                $ref: '#/components/schemas/Transition'
        proof:
          type: object
        documentation:
          type: object
    ActorRequest:
      type: object
      required:
      - actor
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
    LifecycleResource:
      type: object
      properties:
        id:
          type: string
        current_state:
          type: string
        available_transitions:
          type: array
          items:
            type: string
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/Transition'
    TransitionRequest:
      type: object
      required:
      - toState
      - actor
      properties:
        toState:
          type: string
          enum:
          - scheduled
          - confirmed
          - in_progress
          - completed
          - documented
          - invoiced
          - collected
          - verified
          - cancelled
          description: 'Canonical lifecycle target state (PROTOCOL.md 6). The reference implementation
            additionally accepts `delivered` and `charged` in place of `completed` and `invoiced`/`collected`
            — a known divergence tracked in protocol/manifest.yaml (state_machines.service_lifecycle.reference_implementation_divergence),
            migration in PR #23.'
        actor:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
        evidence:
          type: object
    RescheduleRequest:
      type: object
      required:
      - startTime
      - actor
      properties:
        startTime:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
    CancelRequest:
      type: object
      required:
      - actor
      properties:
        reason:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
    CheckinRequest:
      type: object
      required:
      - actor
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        location:
          $ref: '#/components/schemas/GeoLocation'
        timestamp:
          type: string
          format: date-time
    CheckoutRequest:
      type: object
      required:
      - actor
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        location:
          $ref: '#/components/schemas/GeoLocation'
        timestamp:
          type: string
          format: date-time
    EvidenceRequest:
      type: object
      required:
      - evidenceType
      - data
      - actor
      properties:
        evidenceType:
          type: string
          enum:
          - gps
          - signature
          - photo
          - document
          - duration
          - notes
        data:
          type: object
        actor:
          $ref: '#/components/schemas/Actor'
    DocumentationRequest:
      type: object
      required:
      - content
      - actor
      properties:
        content:
          type: string
        templateId:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
    SaleCreateRequest:
      type: object
      required:
      - clientId
      - serviceId
      - providerId
      - unitPrice
      properties:
        clientId:
          type: string
        serviceId:
          type: string
        providerId:
          type: string
        quantity:
          type: integer
          default: 1
        unitPrice:
          type: number
    SaleResource:
      type: object
      properties:
        id:
