name: Integrity checks

# Runs the project's static safety net on every push and PR to main:
#   - ESLint (root)
#   - TypeScript --noEmit (root + mcp-server)
#   - Vitest (mcp-server, unit tests including the bucketing helpers)
#   - FINGERPRINT_SALT parity between lib/ and packages/mcp-server/
#   - Import-extension convention (lib/app vs packages/mcp-server/src)
#   - serverInstructions / public tools parity
#   - protocol/manifest.yaml ↔ tool source parity
#   - Version unification (manifest ↔ PROTOCOL/SPEC/CHANGELOG/package/server.json)
#   - Documentation claims (tool counts, state claims) vs manifest
#
# Independent from publish-mcp-server.yml which only fires when the
# package is bumped. This one catches regressions before they reach
# production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --- Install both workspaces (the repo isn't a formal monorepo) ---
      # Root uses pnpm (pnpm-lock.yaml — same as Vercel); packages/mcp-server
      # stays on npm (own package-lock.json, npm publish pipeline).

      - name: Enable corepack (pnpm from package.json packageManager)
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mcp-server dependencies
        working-directory: packages/mcp-server
        run: npm install --no-audit --no-fund

      # --- Static checks ---

      - name: Lint (root)
        run: pnpm run lint

      - name: TypeScript check (root)
        run: pnpm exec tsc --noEmit

      - name: TypeScript check (mcp-server)
        working-directory: packages/mcp-server
        run: npx tsc --noEmit

      - name: Vitest (mcp-server)
        working-directory: packages/mcp-server
        run: npm test

      # --- Protocol-level guardrails ---

      - name: FINGERPRINT_SALT parity
        run: node scripts/verify-salt-parity.mjs

      - name: Import-extension convention
        run: node scripts/verify-import-extensions.mjs

      - name: serverInstructions / public tools parity
        run: node scripts/verify-server-instructions.mjs

      - name: Manifest / tools parity
        run: node scripts/verify-manifest-tools.mjs

      - name: Version unification
        run: node scripts/verify-versions.mjs

      - name: Documentation claims
        run: node scripts/verify-doc-claims.mjs
