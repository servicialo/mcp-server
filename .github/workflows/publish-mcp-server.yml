name: Publish @servicialo/mcp-server

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-server/**'
      - '.github/workflows/publish-mcp-server.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run build
      - name: Publish to npm if version is new
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @servicialo/mcp-server version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "::notice::Version $LOCAL already published. Nothing to publish."
            exit 0
          fi
          echo "::notice::Publishing $LOCAL (currently published: $PUBLISHED)"
          npm publish --provenance --access public
